<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We Are Hiring - Software Engineers</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: #111;
            color: #fff;
            text-align: center;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .stars {
            position: fixed; 
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: 1;
        }
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            opacity: 0.8;
            animation: travelStars linear infinite;
        }
        @keyframes travelStars {
            from {
                transform: translateY(100vh) scale(0.5);
                opacity: 1;
            }
            to {
                transform: translateY(-100vh) scale(2);
                opacity: 0;
            }
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 2;
            transition: transform 0.1s ease-in-out;
        }
        h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 10px;
            animation: glow 1.5s infinite alternate;
        }
        @keyframes glow {
            from {
                text-shadow: 0 0 5px #ff7b00;
            }
            to {
                text-shadow: 0 0 20px #ff4500;
            }
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            padding: 12px 25px;
            font-size: 1.2em;
            color: white;
            background: #ff7b00;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s;
        }
        .btn:hover {
            background: #ff4500;
        }
        .btn:hover ~ .container {
            animation: shake 0.1s infinite alternate;
        }
        @keyframes shake {
            0% { transform: translateX(-3px); }
            100% { transform: translateX(3px); }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="container" id="container">
        <h1>We Are Hiring!</h1>
        <p>Join our team of passionate software engineers and build amazing things with us.</p>
        <a href="YOUR_GOOGLE_FORM_LINK" class="btn" id="applyBtn">Apply Now</a>
    </div>
    <script>
        function generateStars() {
            const starsContainer = document.getElementById('stars');
            if (!starsContainer) return;
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                star.style.left = Math.random() * 100 + "vw";
                star.style.top = Math.random() * 100 + "vh";
                star.style.animationDuration = (Math.random() * 3 + 2) + "s";
                starsContainer.appendChild(star);
            }
        }
        generateStars();

        // Shake the container when hovering over the apply button
        document.getElementById('applyBtn').addEventListener('mouseover', function() {
            document.getElementById('container').style.animation = 'shake 0.1s infinite alternate';
        });
        document.getElementById('applyBtn').addEventListener('mouseout', function() {
            document.getElementById('container').style.animation = '';
        });
    </script>
</body>
</html>
